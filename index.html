<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzGlobe - 探索世界故事</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.0/dist/globe.gl.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --red: #ff0033;
            --red-dark: #cc0029;
            --red-glow: rgba(255, 0, 51, 0.5);
            --gold: #ffd700;
            --black: #0a0a0a;
            --card: rgba(26, 26, 26, 0.95);
            --gray: #333;
            --text: #fff;
            --text-dim: #888;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #000;
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 3px;
        }
        
        .logo-sub {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-top: 2px;
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .search-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
        }
        
        /* Globe Container */
        #globe-container {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 100%);
        }
        
        /* Book Card floating on globe */
        .book-card {
            background: rgba(20, 20, 20, 0.9);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            width: 70px;
        }
        
        .book-card:hover {
            transform: scale(1.1);
            border-color: var(--red);
            box-shadow: 0 5px 20px rgba(255,0,51,0.4);
        }
        
        .book-card img {
            width: 100%;
            height: 90px;
            object-fit: cover;
        }
        
        .book-card .info {
            padding: 6px;
            background: rgba(0,0,0,0.8);
        }
        
        .book-card .title {
            font-size: 9px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .book-card .rating {
            font-size: 8px;
            color: var(--gold);
            margin-top: 2px;
        }
        
        /* Country Label */
        .country-label {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .country-label.show {
            opacity: 1;
        }
        
        .country-label .name {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: var(--text);
            text-shadow: 0 2px 20px rgba(0,0,0,0.8);
        }
        
        .country-label .name-zh {
            font-size: 16px;
            color: var(--text-dim);
            margin-top: 5px;
        }
        
        /* Bottom Detail Panel */
        .detail-panel {
            position: fixed;
            bottom: -250px;
            left: 20px;
            right: 20px;
            height: 230px;
            background: var(--card);
            backdrop-filter: blur(20px);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            z-index: 1000;
            transition: bottom 0.4s ease;
            display: flex;
            gap: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .detail-panel.show {
            bottom: 0;
        }
        
        .detail-cover {
            width: 140px;
            height: 190px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .detail-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .detail-info {
            flex: 1;
            overflow: hidden;
        }
        
        .detail-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .detail-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .detail-year {
            color: var(--text-dim);
            font-size: 14px;
        }
        
        .detail-rating {
            color: var(--gold);
            font-size: 14px;
        }
        
        .detail-author {
            color: var(--red);
            font-size: 14px;
        }
        
        .detail-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .detail-tag {
            padding: 4px 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 11px;
            color: var(--text-dim);
        }
        
        .detail-desc {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-dim);
            max-height: 60px;
            overflow: hidden;
        }
        
        .detail-developer {
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-dim);
        }
        
        .detail-developer span {
            color: var(--red);
        }
        
        .detail-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
        }
        
        .detail-action {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .detail-action:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px var(--red-glow);
        }
        
        /* Right Side Panel - Country Books */
        .side-panel {
            position: fixed;
            right: -320px;
            top: 0;
            width: 300px;
            height: 100vh;
            background: var(--card);
            backdrop-filter: blur(20px);
            z-index: 900;
            transition: right 0.4s ease;
            padding: 80px 15px 20px;
            overflow-y: auto;
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        
        .side-panel.show {
            right: 0;
        }
        
        .side-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .side-panel-title {
            font-size: 16px;
            font-weight: 600;
        }
        
        .side-panel-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 20px;
            cursor: pointer;
        }
        
        .side-panel-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .side-stat {
            text-align: center;
        }
        
        .side-stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--red);
        }
        
        .side-stat-label {
            font-size: 10px;
            color: var(--text-dim);
        }
        
        .side-books {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        
        .side-book {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .side-book:hover {
            transform: scale(1.05);
            box-shadow: 0 3px 15px rgba(255,0,51,0.3);
        }
        
        .side-book img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }
        
        .side-book .rating {
            padding: 4px;
            font-size: 10px;
            color: var(--gold);
            text-align: center;
        }
        
        /* Stats Footer */
        .stats-footer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: var(--text);
        }
        
        .stat-label {
            font-size: 10px;
            color: var(--text-dim);
        }
        
        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading.hide {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        .loading-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            color: var(--text);
            letter-spacing: 5px;
        }
        
        .loading-bar {
            width: 150px;
            height: 2px;
            background: var(--gray);
            margin-top: 20px;
            overflow: hidden;
        }
        
        .loading-bar-fill {
            height: 100%;
            background: var(--red);
            animation: load 1.5s ease-in-out infinite;
        }
        
        @keyframes load {
            0% { width: 0; margin-left: 0; }
            50% { width: 100%; margin-left: 0; }
            100% { width: 0; margin-left: 100%; }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .detail-panel { 
                flex-direction: column; 
                height: auto;
                max-height: 70vh;
            }
            .detail-cover { 
                width: 100px; 
                height: 140px; 
            }
            .side-panel { width: 100%; right: -100%; }
            .book-card { width: 50px; }
            .book-card img { height: 65px; }
            .book-card .info { padding: 4px; }
            .book-card .title { font-size: 7px; }
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="loading-logo">FIZZGLOBE</div>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
    
    <!-- Header -->
    <header class="header">
        <div>
            <div class="logo">FIZZGLOBE</div>
            <div class="logo-sub" id="statsText">1000 books · 50 countries</div>
        </div>
        <div class="header-right">
            <button class="search-btn" onclick="toggleSearch()">🔍</button>
        </div>
    </header>
    
    <!-- Country Label -->
    <div class="country-label" id="countryLabel">
        <div class="name" id="countryName">France</div>
        <div class="name-zh" id="countryNameZh">法国</div>
    </div>
    
    <!-- Globe -->
    <div id="globe-container"></div>
    
    <!-- Stats Footer -->
    <div class="stats-footer" id="statsFooter">
        <div class="stat-item">
            <div class="stat-value" id="totalBooks">0</div>
            <div class="stat-label">books</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="totalCountries">0</div>
            <div class="stat-label">countries</div>
        </div>
    </div>
    
    <!-- Bottom Detail Panel -->
    <div class="detail-panel" id="detailPanel">
        <button class="detail-close" onclick="closeDetail()">✕</button>
        <div class="detail-cover">
            <img id="detailCover" src="" alt="">
        </div>
        <div class="detail-info">
            <div class="detail-title" id="detailTitle">书名</div>
            <div class="detail-meta">
                <span class="detail-year" id="detailYear">1900</span>
                <span class="detail-rating" id="detailRating">★ 9.0</span>
                <span class="detail-author" id="detailAuthor">作者</span>
            </div>
            <div class="detail-tags" id="detailTags"></div>
            <div class="detail-desc" id="detailDesc">简介内容...</div>
            <div class="detail-developer">开发者: <span>FizzDragon AI</span></div>
        </div>
        <button class="detail-action" onclick="generateDrama()">🎬 生成AI番剧</button>
    </div>
    
    <!-- Side Panel -->
    <div class="side-panel" id="sidePanel">
        <div class="side-panel-header">
            <span class="side-panel-title" id="sidePanelTitle">国家</span>
            <button class="side-panel-close" onclick="closeSidePanel()">✕</button>
        </div>
        <div class="side-panel-stats">
            <div class="side-stat">
                <div class="side-stat-value" id="sideBookCount">0</div>
                <div class="side-stat-label">books</div>
            </div>
            <div class="side-stat">
                <div class="side-stat-value" id="sideAvgRating">0</div>
                <div class="side-stat-label">avg rating</div>
            </div>
        </div>
        <div class="side-books" id="sideBooks"></div>
    </div>
    
    <script>
        let books = [];
        let globe;
        let currentBook = null;
        
        // Country flags
        const countryFlags = {
            'China': '🇨🇳', '中国': '🇨🇳', 'Japan': '🇯🇵', '日本': '🇯🇵',
            'Russia': '🇷🇺', '俄罗斯': '🇷🇺', 'France': '🇫🇷', '法国': '🇫🇷',
            'United Kingdom': '🇬🇧', 'UK': '🇬🇧', '英国': '🇬🇧',
            'Germany': '🇩🇪', '德国': '🇩🇪', 'Italy': '🇮🇹', '意大利': '🇮🇹',
            'Spain': '🇪🇸', '西班牙': '🇪🇸', 'Greece': '🇬🇷', '希腊': '🇬🇷',
            'India': '🇮🇳', '印度': '🇮🇳', 'USA': '🇺🇸', '美国': '🇺🇸'
        };
        
        // Transform book data
        function transformBook(b) {
            return {
                id: b.id,
                title: b.title_original || b.title || '',
                titleEn: b.title_english || b.titleEn || '',
                author: b.author || '',
                country: b.country || '',
                countryZh: b.country_zh || b.countryZh || b.country || '',
                lat: b.lat || 0,
                lng: b.lng || 0,
                rating: b.rating || 8.5,
                genre: b.genre || [],
                year: b.year_published || b.year || 0,
                desc: b.description_zh || b.description_en || b.desc || '',
                image: b.image_url || null
            };
        }
        
        // Get book image
        function getBookImage(book) {
            if (book.image) return book.image;
            return `https://picsum.photos/seed/${book.id}/200/280`;
        }
        
        // Load books
        async function loadBooks() {
            try {
                const response = await fetch('./data/books.json');
                const data = await response.json();
                books = (data.books || data).map(transformBook);
                
                // Update stats
                document.getElementById('totalBooks').textContent = books.length;
                const countries = new Set(books.map(b => b.country).filter(c => c));
                document.getElementById('totalCountries').textContent = countries.size;
                document.getElementById('statsText').textContent = `${books.length} books · ${countries.size} countries`;
                
                return books;
            } catch (e) {
                console.error('Load error:', e);
                return [];
            }
        }
        
        // Create book card element
        function createBookCard(book) {
            const el = document.createElement('div');
            el.className = 'book-card';
            el.innerHTML = `
                <img src="${getBookImage(book)}" alt="${book.title}" onerror="this.src='https://via.placeholder.com/70x90/333/fff?text=${encodeURIComponent(book.title.charAt(0))}'">
                <div class="info">
                    <div class="title">${book.title}</div>
                    <div class="rating">★ ${book.rating}</div>
                </div>
            `;
            el.onclick = () => showDetail(book);
            return el;
        }
        
        // Show book detail
        function showDetail(book) {
            currentBook = book;
            document.getElementById('detailCover').src = getBookImage(book);
            document.getElementById('detailTitle').textContent = book.title;
            document.getElementById('detailYear').textContent = book.year || '-';
            document.getElementById('detailRating').textContent = `★ ${book.rating}`;
            document.getElementById('detailAuthor').textContent = book.author;
            document.getElementById('detailDesc').textContent = book.desc || '暂无简介';
            
            // Tags
            const tagsEl = document.getElementById('detailTags');
            tagsEl.innerHTML = '';
            if (book.countryZh) {
                tagsEl.innerHTML += `<span class="detail-tag">${countryFlags[book.country] || '🌍'} ${book.countryZh}</span>`;
            }
            if (book.genre && book.genre.length) {
                book.genre.slice(0, 3).forEach(g => {
                    tagsEl.innerHTML += `<span class="detail-tag">${g}</span>`;
                });
            }
            
            document.getElementById('detailPanel').classList.add('show');
            document.getElementById('statsFooter').style.display = 'none';
            globe.controls().autoRotate = false;
            
            // Show country label
            if (book.country) {
                document.getElementById('countryName').textContent = book.country;
                document.getElementById('countryNameZh').textContent = book.countryZh;
                document.getElementById('countryLabel').classList.add('show');
            }
        }
        
        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('show');
            document.getElementById('statsFooter').style.display = 'flex';
            document.getElementById('countryLabel').classList.remove('show');
            globe.controls().autoRotate = true;
        }
        
        // Show side panel with country books
        function showCountryBooks(country) {
            const countryBooks = books.filter(b => b.country === country || b.countryZh === country);
            if (countryBooks.length === 0) return;
            
            document.getElementById('sidePanelTitle').textContent = `${countryFlags[country] || '🌍'} ${country}`;
            document.getElementById('sideBookCount').textContent = countryBooks.length;
            
            const avgRating = (countryBooks.reduce((sum, b) => sum + b.rating, 0) / countryBooks.length).toFixed(1);
            document.getElementById('sideAvgRating').textContent = avgRating;
            
            const booksEl = document.getElementById('sideBooks');
            booksEl.innerHTML = '';
            countryBooks.forEach(book => {
                const el = document.createElement('div');
                el.className = 'side-book';
                el.innerHTML = `
                    <img src="${getBookImage(book)}" alt="${book.title}">
                    <div class="rating">★ ${book.rating}</div>
                `;
                el.onclick = () => showDetail(book);
                booksEl.appendChild(el);
            });
            
            document.getElementById('sidePanel').classList.add('show');
        }
        
        function closeSidePanel() {
            document.getElementById('sidePanel').classList.remove('show');
        }
        
        function generateDrama() {
            if (currentBook) {
                alert(`🎬 即将为《${currentBook.title}》生成AI番剧分镜！\n\n功能开发中...`);
            }
        }
        
        function toggleSearch() {
            const query = prompt('搜索书名、作者或国家:');
            if (query) {
                const results = books.filter(b => 
                    b.title.includes(query) || 
                    b.author.includes(query) ||
                    b.countryZh.includes(query)
                );
                if (results.length > 0) {
                    showDetail(results[0]);
                } else {
                    alert('未找到相关书籍');
                }
            }
        }
        
        // Initialize globe
        function initGlobe() {
            // Sample books for display (show fewer to reduce clutter)
            const displayBooks = books
                .sort((a, b) => b.rating - a.rating)
                .slice(0, 80); // Only show top 80 by rating
            
            globe = Globe()
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
                .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
                .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
                .atmosphereColor('#4488ff')
                .atmosphereAltitude(0.25)
                .htmlElementsData(displayBooks)
                .htmlLat('lat')
                .htmlLng('lng')
                .htmlAltitude(0.03)
                .htmlElement(createBookCard)
                (document.getElementById('globe-container'));
            
            // Slow rotation
            globe.controls().autoRotate = true;
            globe.controls().autoRotateSpeed = 0.08;
            
            // Add lights
            const scene = globe.scene();
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            
            // Sun
            const sunGeo = new THREE.SphereGeometry(10, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
            const sun = new THREE.Mesh(sunGeo, sunMat);
            sun.position.set(250, 100, -150);
            scene.add(sun);
            scene.add(new THREE.PointLight(0xffdd00, 1, 600));
            
            // Moon  
            const moonGeo = new THREE.SphereGeometry(4, 32, 32);
            const moonMat = new THREE.MeshBasicMaterial({ color: 0xcccccc });
            const moon = new THREE.Mesh(moonGeo, moonMat);
            moon.position.set(-180, 60, 100);
            scene.add(moon);
            
            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').classList.add('hide');
            }, 1500);
        }
        
        // Init
        window.onload = async function() {
            await loadBooks();
            initGlobe();
        };
    </script>
</body>
</html>
