<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzGlobe - 探索世界故事</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.0/dist/globe.gl.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --red: #e31b23;
            --red-dark: #8b0000;
            --red-glow: rgba(227, 27, 35, 0.6);
            --red-dim: rgba(227, 27, 35, 0.3);
            --black: #000;
            --black-card: rgba(10, 0, 0, 0.92);
            --gray-dark: #1a0a0a;
            --text: #fff;
            --text-dim: #666;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #000;
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* Header - minimal */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--red);
            letter-spacing: 4px;
            text-shadow: 0 0 30px var(--red-glow);
        }
        
        .logo-sub {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-top: 3px;
        }
        
        .search-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(227, 27, 35, 0.1);
            border: 1px solid var(--red-dim);
            color: var(--red);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .search-btn:hover {
            background: var(--red);
            color: white;
            box-shadow: 0 0 20px var(--red-glow);
        }
        
        /* Globe Container */
        #globe-container {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at 30% 30%, #1a0505 0%, #000 60%, #000 100%);
        }
        
        /* Book Card - 3D perspective, layered look */
        .book-card {
            perspective: 800px;
            cursor: pointer;
        }
        
        .book-card-inner {
            width: 65px;
            background: linear-gradient(145deg, rgba(30, 5, 5, 0.95) 0%, rgba(10, 0, 0, 0.98) 100%);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--red-dim);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.8),
                0 2px 8px rgba(227, 27, 35, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transform: rotateX(15deg) rotateY(-5deg);
            transform-style: preserve-3d;
            transition: all 0.4s ease;
        }
        
        .book-card:hover .book-card-inner {
            transform: rotateX(0deg) rotateY(0deg) scale(1.15) translateZ(20px);
            border-color: var(--red);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.9),
                0 0 40px var(--red-glow);
        }
        
        .book-card-inner img {
            width: 100%;
            height: 85px;
            object-fit: cover;
            filter: brightness(0.9) contrast(1.1);
        }
        
        .book-card:hover .book-card-inner img {
            filter: brightness(1) contrast(1.1);
        }
        
        .book-card-info {
            padding: 6px 5px;
            background: linear-gradient(180deg, rgba(20, 0, 0, 0.9) 0%, rgba(0, 0, 0, 1) 100%);
        }
        
        .book-card-title {
            font-size: 8px;
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        
        .book-card-rating {
            font-size: 8px;
            color: var(--red);
            margin-top: 2px;
            text-shadow: 0 0 10px var(--red-glow);
        }
        
        /* Country Label */
        .country-label {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        
        .country-label.show { opacity: 1; }
        
        .country-label .name {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            color: var(--red);
            text-shadow: 0 0 40px var(--red-glow), 0 2px 20px rgba(0,0,0,0.8);
            letter-spacing: 3px;
        }
        
        .country-label .name-zh {
            font-size: 14px;
            color: var(--text-dim);
            margin-top: 5px;
            letter-spacing: 2px;
        }
        
        /* Bottom Detail Panel - dark red theme */
        .detail-panel {
            position: fixed;
            bottom: -280px;
            left: 20px;
            right: 20px;
            height: 260px;
            background: linear-gradient(180deg, rgba(20, 5, 5, 0.98) 0%, rgba(5, 0, 0, 0.99) 100%);
            backdrop-filter: blur(30px);
            border-radius: 20px 20px 0 0;
            padding: 25px;
            z-index: 1000;
            transition: bottom 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            gap: 25px;
            border: 1px solid var(--red-dim);
            border-bottom: none;
            box-shadow: 0 -10px 60px rgba(227, 27, 35, 0.15);
        }
        
        .detail-panel.show { bottom: 0; }
        
        .detail-cover {
            width: 150px;
            height: 210px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid var(--red-dim);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px var(--red-dim);
        }
        
        .detail-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .detail-info {
            flex: 1;
            overflow: hidden;
        }
        
        .detail-title {
            font-size: 26px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .detail-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 12px;
        }
        
        .detail-year {
            color: var(--text-dim);
            font-size: 14px;
        }
        
        .detail-rating {
            color: var(--red);
            font-size: 16px;
            font-weight: 600;
            text-shadow: 0 0 15px var(--red-glow);
        }
        
        .detail-author {
            color: var(--text);
            font-size: 14px;
        }
        
        .detail-author::before {
            content: '✦ ';
            color: var(--red);
        }
        
        .detail-tags {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .detail-tag {
            padding: 5px 12px;
            background: rgba(227, 27, 35, 0.1);
            border: 1px solid var(--red-dim);
            border-radius: 15px;
            font-size: 11px;
            color: var(--red);
        }
        
        .detail-desc {
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-dim);
            max-height: 55px;
            overflow: hidden;
        }
        
        .detail-developer {
            margin-top: 12px;
            font-size: 11px;
            color: var(--text-dim);
        }
        
        .detail-developer span {
            color: var(--red);
            font-weight: 500;
        }
        
        .detail-close {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 36px;
            height: 36px;
            background: rgba(227, 27, 35, 0.1);
            border: 1px solid var(--red-dim);
            border-radius: 50%;
            color: var(--red);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .detail-close:hover {
            background: var(--red);
            color: white;
        }
        
        .detail-action {
            position: absolute;
            bottom: 25px;
            right: 25px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 25px var(--red-glow);
            letter-spacing: 1px;
        }
        
        .detail-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px var(--red-glow);
        }
        
        /* Stats - minimal, red accent */
        .stats-footer {
            position: fixed;
            bottom: 25px;
            left: 30px;
            display: flex;
            gap: 30px;
            z-index: 100;
        }
        
        .stat-item {
            text-align: left;
        }
        
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: var(--red);
            text-shadow: 0 0 20px var(--red-glow);
        }
        
        .stat-label {
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        /* Loading - red theme */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading.hide {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s;
        }
        
        .loading-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            color: var(--red);
            letter-spacing: 6px;
            text-shadow: 0 0 50px var(--red-glow);
        }
        
        .loading-bar {
            width: 120px;
            height: 2px;
            background: var(--gray-dark);
            margin-top: 25px;
            overflow: hidden;
            border-radius: 1px;
        }
        
        .loading-bar-fill {
            height: 100%;
            background: var(--red);
            box-shadow: 0 0 10px var(--red-glow);
            animation: load 1.2s ease-in-out infinite;
        }
        
        @keyframes load {
            0% { width: 0; margin-left: 0; }
            50% { width: 100%; margin-left: 0; }
            100% { width: 0; margin-left: 100%; }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .detail-panel { 
                flex-direction: column;
                height: auto;
                max-height: 75vh;
                padding: 20px;
            }
            .detail-cover { width: 100px; height: 140px; }
            .detail-title { font-size: 20px; }
            .book-card-inner { width: 50px; }
            .book-card-inner img { height: 65px; }
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="loading-logo">FIZZGLOBE</div>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
    
    <!-- Header -->
    <header class="header">
        <div>
            <div class="logo">FIZZGLOBE</div>
            <div class="logo-sub" id="statsText">WORLD LITERATURE</div>
        </div>
        <button class="search-btn" onclick="toggleSearch()">🔍</button>
    </header>
    
    <!-- Country Label -->
    <div class="country-label" id="countryLabel">
        <div class="name" id="countryName">France</div>
        <div class="name-zh" id="countryNameZh">法国</div>
    </div>
    
    <!-- Globe -->
    <div id="globe-container"></div>
    
    <!-- Stats -->
    <div class="stats-footer" id="statsFooter">
        <div class="stat-item">
            <div class="stat-value" id="totalBooks">0</div>
            <div class="stat-label">Books</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="totalCountries">0</div>
            <div class="stat-label">Countries</div>
        </div>
    </div>
    
    <!-- Detail Panel -->
    <div class="detail-panel" id="detailPanel">
        <button class="detail-close" onclick="closeDetail()">✕</button>
        <div class="detail-cover">
            <img id="detailCover" src="" alt="">
        </div>
        <div class="detail-info">
            <div class="detail-title" id="detailTitle">书名</div>
            <div class="detail-meta">
                <span class="detail-year" id="detailYear">1900</span>
                <span class="detail-rating" id="detailRating">★ 9.0</span>
                <span class="detail-author" id="detailAuthor">作者</span>
            </div>
            <div class="detail-tags" id="detailTags"></div>
            <div class="detail-desc" id="detailDesc">简介...</div>
            <div class="detail-developer">开发者: <span>FizzDragon AI</span></div>
        </div>
        <button class="detail-action" onclick="generateDrama()">🎬 生成 AI 番剧</button>
    </div>
    
    <script>
        let books = [];
        let globe;
        let currentBook = null;
        
        const countryFlags = {
            'China': '🇨🇳', '中国': '🇨🇳', 'Japan': '🇯🇵', '日本': '🇯🇵',
            'Russia': '🇷🇺', '俄罗斯': '🇷🇺', 'France': '🇫🇷', '法国': '🇫🇷',
            'United Kingdom': '🇬🇧', '英国': '🇬🇧', 'Germany': '🇩🇪', '德国': '🇩🇪',
            'Italy': '🇮🇹', '意大利': '🇮🇹', 'Spain': '🇪🇸', '西班牙': '🇪🇸',
            'Greece': '🇬🇷', '希腊': '🇬🇷', 'India': '🇮🇳', '印度': '🇮🇳',
            'USA': '🇺🇸', '美国': '🇺🇸', 'Brazil': '🇧🇷', '巴西': '🇧🇷'
        };
        
        function transformBook(b) {
            return {
                id: b.id,
                title: b.title_original || b.title || '',
                titleEn: b.title_english || b.titleEn || '',
                author: b.author || '',
                country: b.country || '',
                countryZh: b.country_zh || b.countryZh || b.country || '',
                lat: b.lat || 0,
                lng: b.lng || 0,
                rating: b.rating || 8.5,
                genre: b.genre || [],
                year: b.year_published || b.year || 0,
                desc: b.description_zh || b.description_en || b.desc || ''
            };
        }
        
        function getBookImage(book) {
            return `https://picsum.photos/seed/${book.id}/200/280`;
        }
        
        async function loadBooks() {
            try {
                const response = await fetch('./data/books.json');
                const data = await response.json();
                books = (data.books || data).map(transformBook);
                document.getElementById('totalBooks').textContent = books.length;
                const countries = new Set(books.map(b => b.country).filter(c => c));
                document.getElementById('totalCountries').textContent = countries.size;
                return books;
            } catch (e) {
                console.error(e);
                return [];
            }
        }
        
        function createBookCard(book) {
            const el = document.createElement('div');
            el.className = 'book-card';
            el.innerHTML = `
                <div class="book-card-inner">
                    <img src="${getBookImage(book)}" alt="${book.title}">
                    <div class="book-card-info">
                        <div class="book-card-title">${book.title}</div>
                        <div class="book-card-rating">★ ${book.rating}</div>
                    </div>
                </div>
            `;
            el.onclick = () => showDetail(book);
            return el;
        }
        
        function showDetail(book) {
            currentBook = book;
            document.getElementById('detailCover').src = getBookImage(book);
            document.getElementById('detailTitle').textContent = book.title;
            document.getElementById('detailYear').textContent = book.year || '-';
            document.getElementById('detailRating').textContent = `★ ${book.rating}`;
            document.getElementById('detailAuthor').textContent = book.author || '佚名';
            document.getElementById('detailDesc').textContent = book.desc || '暂无简介';
            
            const tagsEl = document.getElementById('detailTags');
            tagsEl.innerHTML = '';
            if (book.countryZh) {
                tagsEl.innerHTML += `<span class="detail-tag">${countryFlags[book.country] || '🌍'} ${book.countryZh}</span>`;
            }
            if (book.genre && book.genre.length) {
                book.genre.slice(0, 3).forEach(g => {
                    tagsEl.innerHTML += `<span class="detail-tag">${g}</span>`;
                });
            }
            
            document.getElementById('detailPanel').classList.add('show');
            document.getElementById('statsFooter').style.opacity = '0';
            globe.controls().autoRotate = false;
            
            document.getElementById('countryName').textContent = book.country;
            document.getElementById('countryNameZh').textContent = book.countryZh;
            document.getElementById('countryLabel').classList.add('show');
        }
        
        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('show');
            document.getElementById('statsFooter').style.opacity = '1';
            document.getElementById('countryLabel').classList.remove('show');
            globe.controls().autoRotate = true;
        }
        
        function generateDrama() {
            if (currentBook) {
                alert(`🎬 即将为《${currentBook.title}》生成AI番剧！\n\n功能开发中...`);
            }
        }
        
        function toggleSearch() {
            const query = prompt('搜索书名/作者/国家:');
            if (query) {
                const result = books.find(b => 
                    b.title.includes(query) || 
                    b.author.includes(query) ||
                    b.countryZh.includes(query)
                );
                if (result) showDetail(result);
                else alert('未找到');
            }
        }
        
        function initGlobe() {
            // Show top books by rating, spread out
            const displayBooks = books
                .sort((a, b) => b.rating - a.rating)
                .slice(0, 60);
            
            globe = Globe()
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
                .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
                .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
                .atmosphereColor('#e31b23')
                .atmosphereAltitude(0.18)
                .htmlElementsData(displayBooks)
                .htmlLat('lat')
                .htmlLng('lng')
                .htmlAltitude(d => 0.02 + (d.rating - 8) * 0.015)  // Higher rated = higher altitude
                .htmlElement(createBookCard)
                (document.getElementById('globe-container'));
            
            // Very slow rotation
            globe.controls().autoRotate = true;
            globe.controls().autoRotateSpeed = 0.05;
            
            // Dark ambient
            const scene = globe.scene();
            scene.add(new THREE.AmbientLight(0x331111, 0.4));
            
            // Red-tinted sun
            const sunLight = new THREE.PointLight(0xff3333, 0.8, 800);
            sunLight.position.set(300, 150, -200);
            scene.add(sunLight);
            
            // Dim moon light
            const moonLight = new THREE.PointLight(0x666688, 0.3, 400);
            moonLight.position.set(-200, 80, 150);
            scene.add(moonLight);
            
            setTimeout(() => {
                document.getElementById('loading').classList.add('hide');
            }, 1500);
        }
        
        window.onload = async function() {
            await loadBooks();
            initGlobe();
        };
    </script>
</body>
</html>
