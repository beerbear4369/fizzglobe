<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzGlobe - 探索世界故事</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.0/dist/globe.gl.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --red: #e31b23;
            --red-dark: #8b0000;
            --red-glow: rgba(227, 27, 35, 0.6);
            --red-dim: rgba(227, 27, 35, 0.3);
            --black: #000;
            --text: #fff;
            --text-dim: #666;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #000;
            color: var(--text);
            overflow: hidden;
        }
        
        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--red);
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--red-glow);
        }
        
        .logo-sub {
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
        
        /* Filter Pills */
        .filter-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .filter-pill {
            padding: 6px 14px;
            background: rgba(227, 27, 35, 0.1);
            border: 1px solid var(--red-dim);
            border-radius: 20px;
            color: var(--text-dim);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-pill:hover, .filter-pill.active {
            background: var(--red);
            border-color: var(--red);
            color: white;
            box-shadow: 0 0 15px var(--red-glow);
        }
        
        /* Globe */
        #globe-container {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at 30% 30%, #1a0505 0%, #000 70%);
        }
        
        /* Compact Book Card */
        .book-card {
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .book-card:hover {
            transform: scale(1.2);
            z-index: 100;
        }
        
        .book-card-inner {
            width: 45px;
            background: rgba(15, 5, 5, 0.95);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--red-dim);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }
        
        .book-card:hover .book-card-inner {
            border-color: var(--red);
            box-shadow: 0 8px 30px rgba(227, 27, 35, 0.4);
        }
        
        .book-card-inner img {
            width: 100%;
            height: 58px;
            object-fit: cover;
        }
        
        .book-card-info {
            padding: 3px 4px;
            background: rgba(0, 0, 0, 0.9);
        }
        
        .book-card-title {
            font-size: 6px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .book-card-rating {
            font-size: 6px;
            color: var(--red);
        }
        
        /* Country Label */
        .country-label {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .country-label.show { opacity: 1; }
        
        .country-label .name {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: var(--red);
            text-shadow: 0 0 30px var(--red-glow);
        }
        
        .country-label .name-zh {
            font-size: 13px;
            color: var(--text-dim);
        }
        
        /* Detail Panel */
        .detail-panel {
            position: fixed;
            bottom: -300px;
            left: 15px;
            right: 15px;
            height: 280px;
            background: linear-gradient(180deg, rgba(20, 5, 5, 0.98) 0%, rgba(5, 0, 0, 0.99) 100%);
            backdrop-filter: blur(20px);
            border-radius: 16px 16px 0 0;
            padding: 20px;
            z-index: 1000;
            transition: bottom 0.4s ease;
            display: flex;
            gap: 20px;
            border: 1px solid var(--red-dim);
            border-bottom: none;
        }
        
        .detail-panel.show { bottom: 0; }
        
        .detail-cover {
            width: 130px;
            height: 180px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid var(--red-dim);
        }
        
        .detail-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .detail-info { flex: 1; overflow: hidden; }
        
        .detail-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        
        .detail-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .detail-year { color: var(--text-dim); font-size: 13px; }
        .detail-rating { color: var(--red); font-size: 14px; font-weight: 600; }
        .detail-author { color: var(--text); font-size: 13px; }
        .detail-author::before { content: '✦ '; color: var(--red); }
        
        .detail-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        
        .detail-tag {
            padding: 4px 10px;
            background: rgba(227, 27, 35, 0.15);
            border: 1px solid var(--red-dim);
            border-radius: 12px;
            font-size: 10px;
            color: var(--red);
        }
        
        .detail-desc {
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-dim);
            max-height: 50px;
            overflow: hidden;
        }
        
        .detail-developer {
            margin-top: 10px;
            font-size: 10px;
            color: var(--text-dim);
        }
        .detail-developer span { color: var(--red); }
        
        .detail-close {
            position: absolute;
            top: 15px;
            right: 20px;
            width: 32px;
            height: 32px;
            background: rgba(227, 27, 35, 0.1);
            border: 1px solid var(--red-dim);
            border-radius: 50%;
            color: var(--red);
            font-size: 16px;
            cursor: pointer;
        }
        
        .detail-close:hover {
            background: var(--red);
            color: white;
        }
        
        .detail-action {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--red-glow);
        }
        
        .detail-action:hover {
            transform: translateY(-2px);
        }
        
        /* Stats */
        .stats-footer {
            position: fixed;
            bottom: 20px;
            left: 25px;
            display: flex;
            gap: 25px;
            z-index: 100;
        }
        
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: var(--red);
        }
        
        .stat-label {
            font-size: 8px;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        
        /* Loading */
        .loading {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading.hide {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        .loading-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            color: var(--red);
            letter-spacing: 5px;
        }
        
        .loading-bar {
            width: 100px;
            height: 2px;
            background: #1a0505;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .loading-bar-fill {
            height: 100%;
            background: var(--red);
            animation: load 1.2s ease-in-out infinite;
        }
        
        @keyframes load {
            0% { width: 0; margin-left: 0; }
            50% { width: 100%; margin-left: 0; }
            100% { width: 0; margin-left: 100%; }
        }
        
        @media (max-width: 768px) {
            .filter-bar { display: none; }
            .detail-panel { flex-direction: column; height: auto; max-height: 70vh; }
            .detail-cover { width: 80px; height: 110px; }
            .book-card-inner { width: 35px; }
            .book-card-inner img { height: 45px; }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-logo">FIZZGLOBE</div>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
    
    <header class="header">
        <div>
            <div class="logo">FIZZGLOBE</div>
            <div class="logo-sub" id="statsText">WORLD LITERATURE</div>
        </div>
        <div class="filter-bar">
            <span class="filter-pill active" data-region="all">🌍 全部</span>
            <span class="filter-pill" data-region="asia">🏯 亚洲</span>
            <span class="filter-pill" data-region="europe">🏰 欧洲</span>
            <span class="filter-pill" data-region="americas">🗽 美洲</span>
            <span class="filter-pill" data-region="africa">🌍 非洲</span>
            <span class="filter-pill" data-region="middleeast">🕌 中东</span>
        </div>
    </header>
    
    <div class="country-label" id="countryLabel">
        <div class="name" id="countryName">France</div>
        <div class="name-zh" id="countryNameZh">法国</div>
    </div>
    
    <div id="globe-container"></div>
    
    <div class="stats-footer" id="statsFooter">
        <div class="stat-item">
            <div class="stat-value" id="totalBooks">0</div>
            <div class="stat-label">Books</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="totalCountries">0</div>
            <div class="stat-label">Countries</div>
        </div>
    </div>
    
    <div class="detail-panel" id="detailPanel">
        <button class="detail-close" onclick="closeDetail()">✕</button>
        <div class="detail-cover">
            <img id="detailCover" src="" alt="">
        </div>
        <div class="detail-info">
            <div class="detail-title" id="detailTitle">书名</div>
            <div class="detail-meta">
                <span class="detail-year" id="detailYear">1900</span>
                <span class="detail-rating" id="detailRating">★ 9.0</span>
                <span class="detail-author" id="detailAuthor">作者</span>
            </div>
            <div class="detail-tags" id="detailTags"></div>
            <div class="detail-desc" id="detailDesc">简介...</div>
            <div class="detail-developer">开发者: <span>FizzDragon AI</span></div>
        </div>
        <button class="detail-action" onclick="generateDrama()">🎬 生成 AI 番剧</button>
    </div>
    
    <script>
        let books = [];
        let globe;
        let currentBook = null;
        let currentRegion = 'all';
        
        const countryFlags = {
            'China': '🇨🇳', '中国': '🇨🇳', 'Japan': '🇯🇵', '日本': '🇯🇵',
            'Russia': '🇷🇺', '俄罗斯': '🇷🇺', 'France': '🇫🇷', '法国': '🇫🇷',
            'UK': '🇬🇧', '英国': '🇬🇧', 'Germany': '🇩🇪', '德国': '🇩🇪',
            'Italy': '🇮🇹', '意大利': '🇮🇹', 'Spain': '🇪🇸', '西班牙': '🇪🇸',
            'Greece': '🇬🇷', '希腊': '🇬🇷', 'India': '🇮🇳', '印度': '🇮🇳',
            'USA': '🇺🇸', '美国': '🇺🇸', 'Brazil': '🇧🇷', '巴西': '🇧🇷',
            'Persia': '🇮🇷', '波斯': '🇮🇷', 'Korea': '🇰🇷', '韩国': '🇰🇷',
            'Egypt': '🇪🇬', '埃及': '🇪🇬', 'Nigeria': '🇳🇬', 'South Africa': '🇿🇦',
            'Mexico': '🇲🇽', 'Argentina': '🇦🇷', 'Colombia': '🇨🇴'
        };
        
        const countryRegion = {
            'China': 'asia', 'Japan': 'asia', 'Korea': 'asia', 'India': 'asia',
            'Vietnam': 'asia', 'Thailand': 'asia', 'Indonesia': 'asia',
            'UK': 'europe', 'France': 'europe', 'Germany': 'europe', 'Italy': 'europe',
            'Spain': 'europe', 'Russia': 'europe', 'Greece': 'europe', 'Norway': 'europe',
            'Sweden': 'europe', 'Denmark': 'europe', 'Netherlands': 'europe', 'Poland': 'europe',
            'USA': 'americas', 'Brazil': 'americas', 'Argentina': 'americas', 'Mexico': 'americas',
            'Colombia': 'americas', 'Chile': 'americas', 'Peru': 'americas', 'Cuba': 'americas',
            'Nigeria': 'africa', 'Egypt': 'africa', 'South Africa': 'africa', 'Kenya': 'africa',
            'Ethiopia': 'africa', 'Ghana': 'africa', 'Morocco': 'africa',
            'Persia': 'middleeast', 'Iran': 'middleeast', 'Iraq': 'middleeast', 
            'Arabia': 'middleeast', 'Turkey': 'middleeast', 'Israel': 'middleeast'
        };
        
        function transformBook(b) {
            const country = b.country || '';
            return {
                id: b.id,
                title: b.title_original || b.title || '',
                titleEn: b.title_english || '',
                author: b.author || '',
                country: country,
                countryZh: b.country_zh || country,
                region: countryRegion[country] || 'other',
                lat: b.lat || 0,
                lng: b.lng || 0,
                rating: b.rating || 8.5,
                genre: b.genre || [],
                year: b.year_published || b.year || 0,
                desc: b.description_zh || b.description_en || ''
            };
        }
        
        function getBookImage(book) {
            return `https://picsum.photos/seed/${book.id}/200/280`;
        }
        
        async function loadBooks() {
            try {
                const response = await fetch('./data/books.json');
                const data = await response.json();
                books = (data.books || data).map(transformBook);
                document.getElementById('totalBooks').textContent = books.length;
                const countries = new Set(books.map(b => b.country).filter(c => c));
                document.getElementById('totalCountries').textContent = countries.size;
                return books;
            } catch (e) {
                console.error(e);
                return [];
            }
        }
        
        function createBookCard(book) {
            const el = document.createElement('div');
            el.className = 'book-card';
            el.innerHTML = `
                <div class="book-card-inner">
                    <img src="${getBookImage(book)}" alt="${book.title}">
                    <div class="book-card-info">
                        <div class="book-card-title">${book.title}</div>
                        <div class="book-card-rating">★${book.rating}</div>
                    </div>
                </div>
            `;
            el.onclick = () => showDetail(book);
            return el;
        }
        
        function showDetail(book) {
            currentBook = book;
            document.getElementById('detailCover').src = getBookImage(book);
            document.getElementById('detailTitle').textContent = book.title;
            document.getElementById('detailYear').textContent = book.year || '-';
            document.getElementById('detailRating').textContent = `★ ${book.rating}`;
            document.getElementById('detailAuthor').textContent = book.author || '佚名';
            document.getElementById('detailDesc').textContent = book.desc || '经典文学作品';
            
            const tagsEl = document.getElementById('detailTags');
            tagsEl.innerHTML = `<span class="detail-tag">${countryFlags[book.country] || '🌍'} ${book.countryZh}</span>`;
            if (book.genre) {
                book.genre.slice(0, 3).forEach(g => {
                    tagsEl.innerHTML += `<span class="detail-tag">${g}</span>`;
                });
            }
            
            document.getElementById('detailPanel').classList.add('show');
            document.getElementById('statsFooter').style.opacity = '0';
            document.getElementById('countryName').textContent = book.country;
            document.getElementById('countryNameZh').textContent = book.countryZh;
            document.getElementById('countryLabel').classList.add('show');
            globe.controls().autoRotate = false;
        }
        
        function closeDetail() {
            document.getElementById('detailPanel').classList.remove('show');
            document.getElementById('statsFooter').style.opacity = '1';
            document.getElementById('countryLabel').classList.remove('show');
            globe.controls().autoRotate = true;
        }
        
        function generateDrama() {
            if (currentBook) {
                alert(`🎬 即将为《${currentBook.title}》生成AI番剧！\n\n功能开发中...`);
            }
        }
        
        function filterBooks(region) {
            if (region === 'all') return books;
            return books.filter(b => b.region === region);
        }
        
        function updateGlobe() {
            const filtered = filterBooks(currentRegion);
            const display = filtered.sort((a, b) => b.rating - a.rating).slice(0, 80);
            globe.htmlElementsData(display);
        }
        
        // Filter click handlers
        document.querySelectorAll('.filter-pill').forEach(pill => {
            pill.addEventListener('click', function() {
                document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                currentRegion = this.dataset.region;
                updateGlobe();
            });
        });
        
        function initGlobe() {
            const display = books.sort((a, b) => b.rating - a.rating).slice(0, 80);
            
            globe = Globe()
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
                .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
                .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
                .atmosphereColor('#e31b23')
                .atmosphereAltitude(0.15)
                .htmlElementsData(display)
                .htmlLat('lat')
                .htmlLng('lng')
                .htmlAltitude(0.02)
                .htmlElement(createBookCard)
                (document.getElementById('globe-container'));
            
            globe.controls().autoRotate = true;
            globe.controls().autoRotateSpeed = 0.05;
            
            const scene = globe.scene();
            scene.add(new THREE.AmbientLight(0x331111, 0.3));
            const light = new THREE.PointLight(0xff3333, 0.6, 600);
            light.position.set(250, 120, -150);
            scene.add(light);
            
            setTimeout(() => {
                document.getElementById('loading').classList.add('hide');
            }, 1200);
        }
        
        window.onload = async function() {
            await loadBooks();
            initGlobe();
        };
    </script>
</body>
</html>
