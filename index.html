<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzGlobe - 探索世界故事</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.0/dist/globe.gl.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --red: #e31b23;
            --red-dark: #8b0000;
            --red-glow: rgba(227, 27, 35, 0.5);
            --black: #000;
            --text: #fff;
            --text-dim: #888;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #000;
            color: var(--text);
            overflow: hidden;
        }
        
        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
        }
        
        .logo-area {
            text-align: center;
            flex: 1;
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: var(--text);
            letter-spacing: 4px;
        }
        
        .logo-stats {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 5px;
        }
        
        .country-display {
            margin-top: 15px;
        }
        
        .country-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: var(--text);
        }
        
        .country-name-zh {
            font-size: 13px;
            color: var(--text-dim);
        }
        
        .header-btn {
            width: 36px;
            height: 36px;
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
        }
        
        /* Globe */
        #globe-container {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at 40% 40%, #0a0505 0%, #000 100%);
        }
        
        /* Floating Book Cards - varied sizes */
        .book-card {
            cursor: pointer;
            transition: all 0.4s ease;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
        }
        
        .book-card:hover {
            transform: scale(1.2) translateZ(30px);
            filter: drop-shadow(0 10px 30px rgba(227,27,35,0.5));
            z-index: 1000;
        }
        
        .book-card-inner {
            background: rgba(20, 10, 10, 0.9);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
        }
        
        .book-card:hover .book-card-inner {
            border-color: var(--red);
        }
        
        .book-card-inner img {
            width: 100%;
            display: block;
        }
        
        .book-card-info {
            padding: 4px 5px;
            background: rgba(0,0,0,0.85);
        }
        
        .book-card-title {
            font-size: 7px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .book-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        
        .book-card-rating {
            font-size: 7px;
            color: #ffd700;
        }
        
        .book-card-year {
            font-size: 6px;
            color: var(--text-dim);
        }
        
        /* Right Side Panel */
        .side-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: linear-gradient(270deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 80%, transparent 100%);
            z-index: 500;
            padding: 80px 15px 20px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        
        .side-panel.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        .side-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .side-title {
            font-size: 14px;
            color: var(--text-dim);
        }
        
        .side-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 18px;
            cursor: pointer;
        }
        
        .side-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .side-stat-value {
            font-size: 18px;
            color: var(--red);
        }
        
        .side-stat-label {
            font-size: 9px;
            color: var(--text-dim);
        }
        
        .side-genre {
            font-size: 11px;
            color: var(--red);
            margin-bottom: 15px;
        }
        
        .side-books {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            align-content: start;
        }
        
        .side-book {
            background: rgba(30,15,15,0.8);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        
        .side-book:hover {
            border-color: var(--red);
            transform: scale(1.05);
        }
        
        .side-book img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }
        
        .side-book-info {
            padding: 4px;
        }
        
        .side-book-rating {
            font-size: 9px;
            color: #ffd700;
        }
        
        /* Bottom Detail Panel */
        .detail-panel {
            position: fixed;
            bottom: -220px;
            left: 15px;
            width: calc(100% - 310px);
            height: 200px;
            background: linear-gradient(180deg, rgba(15,5,5,0.95) 0%, rgba(5,0,0,0.98) 100%);
            backdrop-filter: blur(15px);
            border-radius: 12px 12px 0 0;
            padding: 18px;
            z-index: 600;
            transition: bottom 0.4s ease;
            display: flex;
            gap: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            border-bottom: none;
        }
        
        .detail-panel.show { bottom: 0; }
        
        .detail-cover {
            width: 110px;
            height: 160px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .detail-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .detail-info { flex: 1; }
        
        .detail-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .detail-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        
        .detail-year { color: var(--text-dim); }
        .detail-rating { color: #ffd700; }
        .detail-author { color: var(--text); }
        
        .detail-desc {
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-dim);
            max-height: 60px;
            overflow: hidden;
        }
        
        /* Stats Footer */
        .stats-footer {
            position: fixed;
            bottom: 15px;
            left: 20px;
            z-index: 100;
        }
        
        .stats-row {
            display: flex;
            gap: 5px;
            align-items: baseline;
        }
        
        .stats-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--text-dim);
        }
        
        .stats-sep {
            color: var(--text-dim);
            font-size: 10px;
        }
        
        /* Loading */
        .loading {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading.hide {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        .loading-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: var(--text);
            letter-spacing: 5px;
        }
        
        .loading-bar {
            width: 100px;
            height: 2px;
            background: #111;
            margin-top: 20px;
        }
        
        .loading-bar-fill {
            height: 100%;
            background: var(--red);
            animation: load 1s ease-in-out infinite;
        }
        
        @keyframes load {
            0% { width: 0; }
            50% { width: 100%; }
            100% { width: 0; margin-left: 100%; }
        }
        
        @media (max-width: 768px) {
            .side-panel { display: none; }
            .detail-panel { width: calc(100% - 30px); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-logo">FIZZGLOBE</div>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
    
    <header class="header">
        <button class="header-btn" onclick="toggleSearch()">🔍</button>
        <div class="logo-area">
            <div class="logo">FIZZGLOBE</div>
            <div class="logo-stats"><span id="totalBooks">0</span> books · <span id="totalCountries">0</span> countries</div>
            <div class="country-display" id="countryDisplay" style="display:none">
                <div class="country-name" id="countryName">France</div>
                <div class="country-name-zh" id="countryNameZh">法国</div>
            </div>
        </div>
        <button class="header-btn">⚙️</button>
    </header>
    
    <div id="globe-container"></div>
    
    <!-- Right Side Panel -->
    <div class="side-panel" id="sidePanel">
        <div class="side-header">
            <span class="side-title" id="sidePanelTitle">France 法国</span>
            <button class="side-close" onclick="closeSidePanel()">✕</button>
        </div>
        <div class="side-stats">
            <div>
                <div class="side-stat-value" id="sideBookCount">0</div>
                <div class="side-stat-label">Books</div>
            </div>
            <div>
                <div class="side-stat-value" id="sideAvgRating">0</div>
                <div class="side-stat-label">Avg Rating</div>
            </div>
        </div>
        <div class="side-genre" id="sideGenre">小说 · 历史 · 戏剧</div>
        <div class="side-books" id="sideBooks"></div>
    </div>
    
    <!-- Bottom Detail Panel -->
    <div class="detail-panel" id="detailPanel">
        <div class="detail-cover">
            <img id="detailCover" src="" alt="">
        </div>
        <div class="detail-info">
            <div class="detail-title" id="detailTitle">书名</div>
            <div class="detail-meta">
                <span class="detail-year" id="detailYear">1900</span>
                <span class="detail-rating" id="detailRating">★ 9.0</span>
                <span class="detail-author" id="detailAuthor">作者</span>
            </div>
            <div class="detail-desc" id="detailDesc">简介内容...</div>
        </div>
    </div>
    
    <!-- Stats Footer -->
    <div class="stats-footer">
        <div class="stats-row">
            <span class="stats-value" id="footerBooks">0</span>
            <span class="stats-sep">·</span>
            <span class="stats-value" id="footerScale">1.0</span>
        </div>
    </div>
    
    <script>
        let books = [];
        let globe;
        let currentBook = null;
        let currentCountry = null;
        
        const countryFlags = {
            'China': '🇨🇳', 'Japan': '🇯🇵', 'Korea': '🇰🇷', 'India': '🇮🇳',
            'Russia': '🇷🇺', 'France': '🇫🇷', 'UK': '🇬🇧', 'Germany': '🇩🇪',
            'Italy': '🇮🇹', 'Spain': '🇪🇸', 'Greece': '🇬🇷', 'USA': '🇺🇸',
            'Persia': '🇮🇷', 'Egypt': '🇪🇬', 'Brazil': '🇧🇷', 'Mexico': '🇲🇽'
        };
        
        function transformBook(b) {
            return {
                id: b.id,
                title: b.title_original || b.title || '',
                author: b.author || '',
                country: b.country || '',
                countryZh: b.country_zh || b.country || '',
                lat: b.lat || 0,
                lng: b.lng || 0,
                rating: b.rating || 8.5,
                genre: b.genre || [],
                year: b.year_published || b.year || 0,
                desc: b.description_zh || b.description_en || ''
            };
        }
        
        function getBookImage(book) {
            return `https://picsum.photos/seed/${book.id}/200/280`;
        }
        
        async function loadBooks() {
            try {
                const res = await fetch('./data/books.json');
                const data = await res.json();
                books = (data.books || data).map(transformBook);
                
                const total = books.length;
                const countries = new Set(books.map(b => b.country).filter(c => c));
                
                document.getElementById('totalBooks').textContent = total;
                document.getElementById('totalCountries').textContent = countries.size;
                document.getElementById('footerBooks').textContent = total;
                
                return books;
            } catch (e) {
                console.error(e);
                return [];
            }
        }
        
        // Create varied size book cards
        function createBookCard(book, index) {
            const el = document.createElement('div');
            el.className = 'book-card';
            
            // Vary sizes based on rating and random factor
            const baseSize = 40;
            const sizeBonus = (book.rating - 8) * 8;
            const randomBonus = (index % 3) * 5;
            const width = baseSize + sizeBonus + randomBonus;
            const height = width * 1.35;
            
            el.innerHTML = `
                <div class="book-card-inner" style="width:${width}px">
                    <img src="${getBookImage(book)}" alt="${book.title}" style="height:${height}px">
                    <div class="book-card-info">
                        <div class="book-card-title">${book.title}</div>
                        <div class="book-card-meta">
                            <span class="book-card-rating">★${book.rating}</span>
                            <span class="book-card-year">${book.year || ''}</span>
                        </div>
                    </div>
                </div>
            `;
            
            el.onclick = () => {
                showDetail(book);
                showCountryPanel(book.country);
            };
            
            return el;
        }
        
        function showDetail(book) {
            currentBook = book;
            document.getElementById('detailCover').src = getBookImage(book);
            document.getElementById('detailTitle').textContent = book.title;
            document.getElementById('detailYear').textContent = book.year || '-';
            document.getElementById('detailRating').textContent = `★ ${book.rating}`;
            document.getElementById('detailAuthor').textContent = book.author || '佚名';
            document.getElementById('detailDesc').textContent = book.desc || '经典文学作品，值得一读。';
            
            document.getElementById('detailPanel').classList.add('show');
            
            // Show country in header
            document.getElementById('countryDisplay').style.display = 'block';
            document.getElementById('countryName').textContent = book.country;
            document.getElementById('countryNameZh').textContent = book.countryZh;
            
            globe.controls().autoRotate = false;
        }
        
        function showCountryPanel(country) {
            if (!country) return;
            currentCountry = country;
            
            const countryBooks = books.filter(b => b.country === country);
            if (countryBooks.length === 0) return;
            
            const flag = countryFlags[country] || '🌍';
            const countryZh = countryBooks[0].countryZh || country;
            
            document.getElementById('sidePanelTitle').textContent = `${flag} ${country} ${countryZh}`;
            document.getElementById('sideBookCount').textContent = countryBooks.length;
            
            const avgRating = (countryBooks.reduce((s, b) => s + b.rating, 0) / countryBooks.length).toFixed(1);
            document.getElementById('sideAvgRating').textContent = avgRating;
            
            // Get top genres
            const genres = {};
            countryBooks.forEach(b => {
                (b.genre || []).forEach(g => { genres[g] = (genres[g] || 0) + 1; });
            });
            const topGenres = Object.entries(genres).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => e[0]);
            document.getElementById('sideGenre').textContent = topGenres.join(' · ') || '文学';
            
            // Populate books
            const booksEl = document.getElementById('sideBooks');
            booksEl.innerHTML = '';
            countryBooks.sort((a, b) => b.rating - a.rating).forEach(book => {
                const el = document.createElement('div');
                el.className = 'side-book';
                el.innerHTML = `
                    <img src="${getBookImage(book)}" alt="${book.title}">
                    <div class="side-book-info">
                        <div class="side-book-rating">★ ${book.rating}</div>
                    </div>
                `;
                el.onclick = () => showDetail(book);
                booksEl.appendChild(el);
            });
            
            document.getElementById('sidePanel').classList.add('show');
        }
        
        function closeSidePanel() {
            document.getElementById('sidePanel').classList.remove('show');
            document.getElementById('detailPanel').classList.remove('show');
            document.getElementById('countryDisplay').style.display = 'none';
            globe.controls().autoRotate = true;
        }
        
        function toggleSearch() {
            const q = prompt('搜索书名/作者/国家:');
            if (q) {
                const result = books.find(b => 
                    b.title.includes(q) || b.author.includes(q) || b.countryZh.includes(q)
                );
                if (result) {
                    showDetail(result);
                    showCountryPanel(result.country);
                } else {
                    alert('未找到');
                }
            }
        }
        
        function initGlobe() {
            // Display top books with varied altitudes for depth
            const display = books
                .sort((a, b) => b.rating - a.rating)
                .slice(0, 70);
            
            globe = Globe()
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
                .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
                .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
                .atmosphereColor('#441111')
                .atmosphereAltitude(0.12)
                .htmlElementsData(display)
                .htmlLat('lat')
                .htmlLng('lng')
                .htmlAltitude((d, i) => 0.01 + (d.rating - 8) * 0.02 + (i % 5) * 0.008)
                .htmlElement((d, i) => createBookCard(d, i))
                (document.getElementById('globe-container'));
            
            globe.controls().autoRotate = true;
            globe.controls().autoRotateSpeed = 0.04;
            globe.controls().enableZoom = true;
            
            // Darker lighting
            const scene = globe.scene();
            scene.add(new THREE.AmbientLight(0x220808, 0.3));
            
            const redLight = new THREE.PointLight(0xff2222, 0.4, 500);
            redLight.position.set(200, 100, -100);
            scene.add(redLight);
            
            setTimeout(() => {
                document.getElementById('loading').classList.add('hide');
            }, 1200);
        }
        
        window.onload = async function() {
            await loadBooks();
            initGlobe();
        };
    </script>
</body>
</html>
