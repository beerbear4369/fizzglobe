<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzGlobe - 探索世界故事</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.0/dist/globe.gl.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --red: #ff0033;
            --red-dark: #cc0029;
            --red-glow: rgba(255, 0, 51, 0.5);
            --black: #0a0a0a;
            --card: #1a1a1a;
            --card-hover: #252525;
            --gray: #333;
            --text: #fff;
            --text-dim: #888;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--black);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0) 100%);
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--red) 0%, #ff6666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--red-glow);
        }
        
        .nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        
        .nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        
        .nav a:hover { color: var(--red); }
        
        .search-box {
            display: flex;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--gray);
            border-radius: 25px;
            padding: 8px 15px;
            transition: border-color 0.3s;
        }
        
        .search-box:focus-within { border-color: var(--red); }
        
        .search-box input {
            background: none;
            border: none;
            color: var(--text);
            outline: none;
            width: 200px;
            font-size: 14px;
        }
        
        .search-box .icon { color: var(--text-dim); margin-right: 10px; }
        
        /* Globe Container */
        #globe-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        /* Book Marker on Globe */
        .book-marker {
            width: 60px;
            height: 80px;
            background: var(--card);
            border: 2px solid var(--red);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 51, 0.3);
        }
        
        .book-marker:hover {
            transform: scale(1.2);
            box-shadow: 0 8px 25px rgba(255, 0, 51, 0.5);
            z-index: 100;
        }
        
        .book-marker img {
            width: 100%;
            height: 60px;
            object-fit: cover;
        }
        
        .book-marker .title {
            font-size: 8px;
            padding: 2px 4px;
            text-align: center;
            color: var(--text);
            background: var(--black);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Fallback cover with gradient */
        .book-marker .cover-fallback {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: linear-gradient(135deg, var(--red-dark) 0%, var(--black) 100%);
        }
        
        /* Stats Overlay */
        .stats-overlay {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            gap: 20px;
        }
        
        .stat-card {
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid var(--gray);
            border-radius: 12px;
            padding: 15px 25px;
            backdrop-filter: blur(10px);
        }
        
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            color: var(--red);
            line-height: 1;
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 5px;
        }
        
        /* Filter Tabs */
        .filter-tabs {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(26, 26, 26, 0.9);
            padding: 10px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--gray);
        }
        
        .filter-tab {
            padding: 10px 20px;
            border-radius: 20px;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .filter-tab:hover { color: var(--text); }
        .filter-tab.active {
            background: var(--red);
            color: var(--text);
        }
        
        /* View Toggle */
        .view-toggle {
            position: fixed;
            top: 80px;
            right: 30px;
            display: flex;
            gap: 5px;
            background: rgba(26, 26, 26, 0.9);
            padding: 5px;
            border-radius: 20px;
            border: 1px solid var(--gray);
        }
        
        .view-btn {
            padding: 8px 15px;
            border-radius: 15px;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        
        .view-btn.active {
            background: var(--red);
            color: var(--text);
        }
        
        /* Book Panel */
        .book-panel {
            position: fixed;
            right: -500px;
            top: 0;
            width: 500px;
            height: 100vh;
            background: var(--card);
            border-left: 1px solid var(--gray);
            padding: 30px;
            overflow-y: auto;
            transition: right 0.4s ease;
            z-index: 999;
        }
        
        .book-panel.active { right: 0; }
        
        .book-panel .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
        }
        
        .book-cover-large {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, var(--gray) 0%, var(--black) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid var(--gray);
            overflow: hidden;
        }
        
        .book-cover-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .book-cover-large .title-preview {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: var(--red);
            text-align: center;
            padding: 20px;
        }
        
        .book-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .book-title-en {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 15px;
        }
        
        .book-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .book-tag {
            padding: 5px 12px;
            background: var(--black);
            border: 1px solid var(--gray);
            border-radius: 15px;
            font-size: 12px;
            color: var(--text-dim);
        }
        
        .book-tag.country {
            border-color: var(--red);
            color: var(--red);
        }
        
        .book-info {
            margin-bottom: 20px;
        }
        
        .book-info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray);
        }
        
        .book-info-label { color: var(--text-dim); }
        .book-info-value { color: var(--text); }
        
        .book-desc {
            line-height: 1.8;
            color: var(--text-dim);
            margin-bottom: 20px;
        }
        
        .book-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .btn {
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            text-decoration: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
            border: none;
            color: var(--text);
            box-shadow: 0 4px 15px var(--red-glow);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--red-glow);
        }
        
        .btn-secondary {
            background: var(--black);
            border: 1px solid var(--gray);
            color: var(--text);
        }
        
        .btn-secondary:hover {
            border-color: var(--red);
            color: var(--red);
        }
        
        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        
        .loading.hide {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: var(--red);
            margin-top: 20px;
        }
        
        .loading-bar {
            width: 200px;
            height: 3px;
            background: var(--gray);
            border-radius: 2px;
            margin-top: 15px;
            overflow: hidden;
        }
        
        .loading-bar-fill {
            height: 100%;
            background: var(--red);
            animation: loading 1.5s ease-in-out infinite;
        }
        
        @keyframes loading {
            0% { width: 0; margin-left: 0; }
            50% { width: 100%; margin-left: 0; }
            100% { width: 0; margin-left: 100%; }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header { padding: 10px 15px; }
            .logo { font-size: 20px; }
            .nav { display: none; }
            .stats-overlay { flex-direction: column; left: 15px; bottom: 100px; }
            .filter-tabs { width: 90%; overflow-x: auto; }
            .book-panel { width: 100%; }
            .book-marker { width: 40px; height: 55px; }
            .book-marker img, .book-marker .cover-fallback { height: 40px; }
            .book-marker .title { font-size: 6px; }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading" id="loading">

    <!-- Header -->

    <!-- Filter Tabs -->

        <button class="filter-tab" data-filter="神话">👻 神话</button>

        <button class="filter-tab" data-filter="戏剧">🎭 戏剧</button>

    <!-- Book Panel -->
    <div class="book-panel" id="bookPanel">

        };
        
        // Transform JSON data to internal format
        function transformBook(b) {
            return {
                id: b.id,
                title: b.title_original || b.title,
                titleEn: b.title_english || b.titleEn || '',
                author: b.author,
                country: b.country,
                countryZh: b.country_zh || b.countryZh || b.country,
                flag: countryFlags[b.country] || '🌍',
                lat: b.lat,
                lng: b.lng,
                rating: b.rating || 8.5,
                genre: b.genre || [],
                era: b.era || '',
                year: b.year_published || b.year,
                chapters: b.chapters || 0,
                desc: b.description_zh || b.description_en || b.desc || '',
                image: b.image_url || b.image || null,
                wiki: b.wiki_url || null
            };
        }
        
        // Generate placeholder image URL using Picsum or gradient
        function getBookImage(book) {
            if (book.image) return book.image;
            // Use consistent seed based on book id for reproducible images
            return `https://picsum.photos/seed/${book.id}/200/150`;
        }
        
        // Load books from JSON
        async function loadBooks() {
            try {
                const response = await fetch('./data/books.json');
                const data = await response.json();
                books = data.books.map(transformBook);
                document.getElementById('totalBooks').textContent = books.length;
                const countries = new Set(books.map(b => b.country));
                document.getElementById('totalCountries').textContent = countries.size;
                return books;
            } catch (error) {
                console.error('Failed to load books:', error);
                // Fallback sample data
                books = getSampleBooks();
                document.getElementById('totalBooks').textContent = books.length;
                return books;
            }
        }

                { id: 10, title: "神曲", titleEn: "Divine Comedy", author: "但丁", country: "Italy", countryZh: "意大利", flag: "🇮🇹", lat: 43.77, lng: 11.25, rating: 9.5, genre: ["史诗", "宗教"], era: "14世纪", year: 1320, chapters: 100, desc: "但丁游历地狱、炼狱、天堂的精神之旅。" }
            ];
        }
        
        // Create book marker element
        function createBookMarker(book) {
            const el = document.createElement('div');
            el.className = 'book-marker';
            el.innerHTML = `
                <img src="${getBookImage(book)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" alt="${book.title}">
                <div class="cover-fallback" style="display:none;">${book.flag}</div>
                <div class="title">${book.title}</div>
            `;
            el.onclick = () => showBookPanel(book);
            return el;
        }
        
        // Initialize Globe
        function initGlobe() {
            const filteredBooks = filterBooks();
            
            globe = Globe()
                .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
                .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
                .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
                .atmosphereColor('#ff0033')
                .atmosphereAltitude(0.15)
                (document.getElementById('globe-container'));
            
            updateGlobeView(filteredBooks);
            
            // Auto rotate
            globe.controls().autoRotate = true;
            globe.controls().autoRotateSpeed = 0.3;
            
            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').classList.add('hide');
            }, 1500);
        }
        
        // Update globe based on view mode
        function updateGlobeView(data) {
            if (currentView === 'cards') {
                // HTML Elements mode - show image cards
                globe
                    .pointsData([])
                    .htmlElementsData(data)
                    .htmlLat('lat')
                    .htmlLng('lng')
                    .htmlAltitude(0.05)
                    .htmlElement(createBookMarker);
            } else {
                // Points mode - show simple dots
                globe
                    .htmlElementsData([])
                    .pointsData(data)
                    .pointLat('lat')
                    .pointLng('lng')
                    .pointColor(() => '#ff0033')
                    .pointAltitude(0.02)
                    .pointRadius(0.3)
                    .pointLabel(d => `<div style="background:#1a1a1a;padding:10px;border-radius:8px;border:1px solid #ff0033;">
                        <strong style="color:#ff0033">${d.title}</strong><br>
                        <span style="color:#888">${d.author} | ${d.countryZh}</span>
                    </div>`)
                    .onPointClick(showBookPanel);
            }
        }
        
        // Filter books
        function filterBooks() {
            if (currentFilter === 'all') return books;
            return books.filter(b => b.genre && b.genre.includes(currentFilter));
        }
        
        // Show Book Panel
        function showBookPanel(book) {
            const panel = document.getElementById('bookPanel');
            panel.classList.add('active');
            
            // Update cover
            const coverEl = document.getElementById('bookCoverLarge');
            if (book.image || true) { // Always try image first
                coverEl.innerHTML = `<img src="${getBookImage(book)}" onerror="this.outerHTML='<div class=\\'title-preview\\'>${book.title}</div>'" alt="${book.title}">`;
            } else {
                coverEl.innerHTML = `<div class="title-preview">${book.title}</div>`;
            }
            
            document.getElementById('bookTitle').textContent = book.title;
            document.getElementById('bookTitleEn').textContent = book.titleEn;
            document.getElementById('bookAuthor').textContent = book.author;
            document.getElementById('bookEra').textContent = book.era ? `${book.era} (${book.year}年)` : `${book.year}年`;
            document.getElementById('bookChapters').textContent = book.chapters ? `${book.chapters}章/回` : '-';
            document.getElementById('bookRating').textContent = `⭐ ${book.rating}`;
            document.getElementById('bookDesc').textContent = book.desc;
            
            // Update meta tags
            let metaHtml = `<span class="book-tag country">${book.flag} ${book.countryZh}</span>`;
            if (book.genre) {
                book.genre.forEach(g => {
                    const emoji = genreEmoji[g] || '📖';
                    metaHtml += `<span class="book-tag">${emoji} ${g}</span>`;
                });
            }
            document.getElementById('bookMeta').innerHTML = metaHtml;
            
            // Wiki link
            const wikiBtn = document.getElementById('wikiLink');
            if (book.wiki) {
                wikiBtn.onclick = () => window.open(book.wiki, '_blank');
            } else {
                wikiBtn.onclick = () => window.open(`https://zh.wikipedia.org/wiki/${encodeURIComponent(book.title)}`, '_blank');
            }
            
            // Store current book for AI generation
            window.currentBook = book;
            
            // Stop rotation when viewing
            globe.controls().autoRotate = false;
        }
        
        function closeBookPanel() {
            document.getElementById('bookPanel').classList.remove('active');
            globe.controls().autoRotate = true;
        }
        
        // Generate AI Drama
        function generateDrama() {
            if (window.currentBook) {
                const url = `https://fizzdragon.com/generate?title=${encodeURIComponent(window.currentBook.title)}&author=${encodeURIComponent(window.currentBook.author)}`;
                window.open(url, '_blank');
            }
        }
        
        // View toggle
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentView = this.dataset.view;
                updateGlobeView(filterBooks());
            });
        });
        
        // Filter tabs
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                updateGlobeView(filterBooks());
            });
        });
        
        // Search
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const filtered = books.filter(b => 
                b.title.toLowerCase().includes(query) ||
                (b.titleEn && b.titleEn.toLowerCase().includes(query)) ||
                b.author.toLowerCase().includes(query) ||
                b.countryZh.includes(query)
            );
            updateGlobeView(filtered);
        });
        
        // Initialize
        window.onload = async function() {
            await loadBooks();
            initGlobe();
        };
    </script>
</body>
</html>
